name: Bug Report
description: Report a bug with the Salesforce CLI
title: "[Bug]: "
labels: ["type:bug"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        > **NOTICE:** GitHub is not a mechanism for receiving support under any agreement or SLA.
        > If you require immediate assistance, please use [official support channels](https://help.salesforce.com).

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issues
      description: Please search [existing issues](https://github.com/forcedotcom/cli/issues) before filing a new one.
      options:
        - label: I have searched the existing issues
          required: true

  - type: input
    id: related-issue
    attributes:
      label: Related issue
      description: If you found a related issue, link it here.
      placeholder: "https://github.com/forcedotcom/cli/issues/1234"
    validations:
      required: false

  - type: input
    id: command
    attributes:
      label: Command
      description: Which sf command did you run?
      placeholder: "sf project retrieve start -m PermissionSet:sysadmin"
    validations:
      required: true

  - type: dropdown
    id: org-type
    attributes:
      label: Org Type
      options:
        - Production
        - Sandbox
        - Scratch Org
        - Developer Edition
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short description of the problem
    validations:
      required: true

  - type: input
    id: repro-repo
    attributes:
      label: Repository to reproduce
      description: "If not reproducible with [dreamhouse-lwc](https://github.com/dreamhouseapp/dreamhouse-lwc), we require a link to a simple project repo with a script to setup a scratch org that reproduces your problem."
      placeholder: "https://github.com/dreamhouseapp/dreamhouse-lwc"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Run `sf project retrieve start -m ...`
        2. Open the retrieved file
        3. Notice the missing field
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Message or Output
      description: Paste the full error message, stack trace, or unexpected output. For more detail, re-run your command with `--dev-debug` and paste the output. **Redact any tokens or sensitive information.** This will be automatically formatted into code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: system-info
    attributes:
      label: System Information
      description: Paste the **full** output of `sf version --verbose --json`
      render: json
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other context about the problem

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or log files
      description: Drag and drop any relevant screenshots or log files.
    validations:
      required: false
