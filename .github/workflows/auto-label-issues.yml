name: Auto Label Issues

on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const labels = [];
            const comments = [];

            // =====================
            // 1. DETECTION (all labels gathered before any apply)
            // =====================

            // --- Parse command → plugin label ---
            const commandMatch = body.match(/### Command\s*\n\s*(.+)/);
            const command = commandMatch ? commandMatch[1].trim().toLowerCase() : '';

            const commandToPlugin = {
              'project deploy pipeline': 'plugin:devops-center',
              'project deploy validate': 'plugin:devops-center',
              'project deploy': 'plugin:deploy-retrieve',
              'project retrieve': 'plugin:deploy-retrieve',
              'project convert': 'plugin:deploy-retrieve',
              'project delete': 'plugin:deploy-retrieve',
              'org create scratch': 'plugin:signups',
              'org create sandbox': 'plugin:signups',
              'org create shape': 'plugin:signups',
              'org create snapshot': 'plugin:signups',
              'org create': 'plugin:org',
              'org open': 'plugin:org',
              'org list': 'plugin:org',
              'org display': 'plugin:org',
              'org delete': 'plugin:org',
              'org resume': 'plugin:org',
              'org login': 'plugin:auth',
              'org logout': 'plugin:auth',
              'auth': 'plugin:auth',
              'data query': 'plugin:data',
              'data export': 'plugin:data',
              'data import': 'plugin:data',
              'data bulk': 'plugin:data',
              'data create': 'plugin:data',
              'data update': 'plugin:data',
              'data delete': 'plugin:data',
              'data upsert': 'plugin:data',
              'apex run': 'plugin:apex',
              'apex get': 'plugin:apex',
              'apex log': 'plugin:apex',
              'apex test': 'plugin:apex',
              'devops': 'plugin:devops-center',
              'package': 'plugin:packaging',
              'agent': 'plugin:agent',
              'lightning': 'plugin:lightning-dev',
              'schema': 'plugin:schema',
              'sobject': 'plugin:sobject',
            };

            const sortedKeys = Object.keys(commandToPlugin).sort((a, b) => b.length - a.length);
            for (const key of sortedKeys) {
              if (command.includes(key)) {
                labels.push(commandToPlugin[key]);
                break;
              }
            }

            const pluginLabel = labels.find(l => l.startsWith('plugin:'));

            // --- Parse org type ---
            const orgMatch = body.match(/### Org Type\s*\n\s*(.+)/);
            const orgType = orgMatch ? orgMatch[1].trim() : '';

            if (orgType === 'Scratch Org') labels.push('org:scratch');
            if (orgType === 'Sandbox') labels.push('org:sandbox');
            if (orgType === 'Production') labels.push('org:production');

            // --- Parse regression ---
            const regressionMatch = body.match(/### Did this work before\?\s*\n\s*(.+)/);
            const regression = regressionMatch ? regressionMatch[1].trim() : '';

            if (regression.startsWith('Yes')) labels.push('regression');

            // --- Detect server-side error patterns ---
            const serverSidePatterns = [
              'UNKNOWN_EXCEPTION',
              'Internal Salesforce Error',
              'INSUFFICIENT_ACCESS',
              'INVALID_OPERATION',
              'INVALID_SESSION_ID',
              'SERVER_UNAVAILABLE',
              'REQUEST_LIMIT_EXCEEDED',
            ];
            const bodyUpper = body.toUpperCase();
            const matchedServerError = serverSidePatterns.find(p => bodyUpper.includes(p.toUpperCase()));

            if (matchedServerError) {
              labels.push('possibly:server-side');
            }

            // --- Detect team ownership ---
            const teamOwnership = {
              'plugin:agent': 'Agentforce DX',
              'plugin:devops-center': 'DevOps',
              'plugin:signups': 'Signups',
              'plugin:packaging': 'Packaging',
            };

            const owningTeam = teamOwnership[pluginLabel];

            if (owningTeam) {
              labels.push('owned by another team');
            }

            // --- Check for low-quality or missing required fields ---
            const lowEffortPatterns = /^(n\/?a|na|none|no|test|asdf|xxx|\.|-|—|tbd|todo|see above|see title|same)$/i;

            function isLowEffort(text) {
              if (!text) return true;
              const cleaned = text.replace(/[`#*_\s]/g, '').trim();
              if (cleaned.length < 10) return true;
              if (lowEffortPatterns.test(cleaned)) return true;
              return false;
            }

            function extractSection(sectionName) {
              const regex = new RegExp(`### ${sectionName}\\s*\\n\\s*([\\s\\S]*?)(?=###|$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const missingFields = [];

            const summary = extractSection('Summary');
            if (isLowEffort(summary)) missingFields.push('Summary');

            const steps = extractSection('Steps To Reproduce');
            if (isLowEffort(steps)) missingFields.push('Steps To Reproduce');

            const expected = extractSection('Expected Result');
            if (isLowEffort(expected)) missingFields.push('Expected Result');

            const actual = extractSection('Actual Result');
            if (isLowEffort(actual)) missingFields.push('Actual Result');

            const sysInfoMatch = body.match(/### System Information\s*\n\s*```[\s\S]*?```/);
            if (!sysInfoMatch) missingFields.push('System Information');

            if (missingFields.length > 0) labels.push('needs-info');

            // =====================
            // 2. APPLY LABELS (single pass, all labels at once)
            // =====================

            const labelColors = {
              'type:bug':               { color: 'd73a4a', description: 'Something is not working' },
              'plugin:deploy-retrieve': { color: '1d76db', description: 'Deploy and retrieve commands' },
              'plugin:auth':            { color: '1d76db', description: 'Auth and login commands' },
              'plugin:org':             { color: '1d76db', description: 'Org management commands' },
              'plugin:data':            { color: '1d76db', description: 'Data commands' },
              'plugin:apex':            { color: '1d76db', description: 'Apex commands' },
              'plugin:packaging':       { color: '1d76db', description: 'Packaging commands' },
              'plugin:agent':           { color: '1d76db', description: 'Agent/AFDX commands' },
              'plugin:signups':         { color: '1d76db', description: 'Scratch org and sandbox creation' },
              'plugin:lightning-dev':   { color: '1d76db', description: 'Lightning dev commands' },
              'plugin:schema':          { color: '1d76db', description: 'Schema commands' },
              'plugin:sobject':         { color: '1d76db', description: 'SObject commands' },
              'plugin:devops-center':   { color: '1d76db', description: 'DevOps Center commands' },
              'org:scratch':            { color: '0e8a16', description: 'Scratch org' },
              'org:sandbox':            { color: '0e8a16', description: 'Sandbox org' },
              'org:production':         { color: '0e8a16', description: 'Production org' },
              'regression':             { color: 'd93f0b', description: 'Worked before, now broken' },
              'needs-info':             { color: 'fbca04', description: 'Missing required information' },
              'owned by another team':  { color: 'e99695', description: 'Bug is owned by another team' },
              'possibly:server-side':   { color: 'e99695', description: 'May be a server-side issue, not CLI' },
            };

            const uniqueLabels = [...new Set(labels)];

            // Ensure all labels exist with correct colors
            for (const name of uniqueLabels) {
              const config = labelColors[name] || { color: 'ededed', description: '' };
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: config.color,
                  description: config.description,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: config.color,
                    description: config.description,
                  });
                }
              }
            }

            // Also ensure type:bug has correct color (added by form, not by us)
            try {
              await github.rest.issues.updateLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'type:bug',
                color: 'd73a4a',
                description: 'Something is not working',
              });
            } catch (e) {}

            // Apply all labels at once
            if (uniqueLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: uniqueLabels,
              });
            }

            // =====================
            // 3. AUTO-RESPONSE
            // =====================

            // Team ownership message
            if (owningTeam) {
              let msg = `ℹ️ This command is owned by the **${owningTeam}** team.`;
              if (matchedServerError) {
                msg += ` The error \`${matchedServerError}\` also suggests this may be a server-side issue.`;
              }
              msg += ` We'll investigate and route accordingly.`;
              comments.push(msg);
            } else if (matchedServerError) {
              comments.push(
                `⚠️ The error \`${matchedServerError}\` typically originates from the Salesforce server, not the CLI. ` +
                `We'll investigate to confirm, but this may need to be reported to [Salesforce Support](https://help.salesforce.com) if it's a server-side issue.`
              );
            }

            // Missing fields message
            if (missingFields.length > 0) {
              const fieldList = missingFields.map(f => `- **${f}**`).join('\n');
              comments.push(
                `⚠️ The following fields are missing or need more detail:\n${fieldList}\n\n` +
                `Please update your issue with this information so we can investigate.`
              );
            }

            // Post comment
            if (comments.length > 0) {
              const header = 'Thank you for filing this issue. We appreciate your feedback and will review the issue as soon as possible. ' +
                'Remember, however, that GitHub isn\'t a mechanism for receiving support under any agreement or SLA. ' +
                'If you require immediate assistance, contact [Salesforce Customer Support](https://help.salesforce.com).';
              const commentBody = header + '\n\n---\n\n' + comments.join('\n\n---\n\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

            console.log(`Labels applied: ${uniqueLabels.join(', ') || 'none'}`);